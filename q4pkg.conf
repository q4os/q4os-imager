# Q4OS package manifest - machine readable metadata for build tooling and agents
source="q4os-imager"
kind="external"
binaries="q4os-imager"
targets="deb11 deb12 deb13 deb14 uqk3 uqk4 uqk5 rpi12"  # published 2026-07-22 as 1.7.5-a1 (1.7.5-a1-rpi12 on rpi12), supersedes the old src_1/1.7.4.2 rpi-imager rebrand
build_targets="deb14"  # see notes - deb14 must NOT reuse the deb11 artifact
upstream_url="https://github.com/q4os/q4os-imager"
upstream_watch="github:raspberrypi/rpi-imager"
watch_pkg=""
notes="Q4OS fork of rpi-imager (Qt5/CMake); Windows .exe built via GitHub Actions + NSIS. build_targets=deb14 because Depends comes from \${shlibs:Depends}: a bullseye build hardcodes libcurl3-gnutls, and forky's libcurl3t64-gnutls 8.21.0-2 DROPPED its Provides: libcurl3-gnutls (trixie 8.14.1 and resolute 8.18.0 still carry it). The reused deb11 binary is therefore uninstallable on forky, and apt resolves that by holding back the entire Plasma 6.5.4/6.6.3 -> 6.7.4 stack - 126 packages on the r6 live build - rather than removing the imager. A real forky compile regenerates the dep as libcurl4-gnutls (>= 8.20.0-3~) - VERIFIED on the 2026-08-25 rebuild; forky ships both libcurl3t64-gnutls and libcurl4-gnutls at 8.21.0-2 and shlibdeps picks the latter. deb11/deb12/deb13/uqk3/uqk4/uqk5/rpi12 are unaffected and keep reusing the deb11 artifact. All 16 Build-Depends exist on forky (Qt5 still shipping at 5.15.19). PUBLISH CAVEAT: this build must carry a -deb14 version tag (cf. q4os-api 4.5.5-deb13a1) before it goes to production - an untagged deb14 build has the SAME filename as the deb11 artifact with different content, and publishdebs.sh only has dedup_deb13(), no deb14 equivalent, so the untagged deb11 build would not be displaced from the forky dir."
