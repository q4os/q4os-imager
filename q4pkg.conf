# Q4OS package manifest - machine readable metadata for build tooling and agents
source="q4os-imager"
kind="external"
binaries="q4os-imager"
targets="deb12 deb13 deb14 uqk3 uqk4 uqk5 rpi12"  # published 2026-07-22 as 1.7.5-a1 (1.7.5-a1-rpi12 on rpi12), supersedes the old src_1/1.7.4.2 rpi-imager rebrand
build_targets="deb14"  # see notes - deb14 must NOT reuse the deb11 artifact
upstream_url="https://github.com/q4os/q4os-imager"
upstream_watch="github:raspberrypi/rpi-imager"
watch_pkg=""
notes="Q4OS fork of rpi-imager (Qt5/CMake); Windows .exe built via GitHub Actions + NSIS. build_targets=deb14 because Depends comes from \${shlibs:Depends}: a bullseye build hardcodes libcurl3-gnutls, and forky's libcurl3t64-gnutls 8.21.0-2 DROPPED its Provides: libcurl3-gnutls (trixie 8.14.1 and resolute 8.18.0 still carry it). The reused deb11 binary is therefore uninstallable on forky, and apt resolves that by holding back the entire Plasma 6.5.4/6.6.3 -> 6.7.4 stack - 126 packages on the r6 live build - rather than removing the imager. A real forky compile regenerates the dep as libcurl4-gnutls (>= 8.20.0-3~) - VERIFIED on the 2026-08-25 rebuild; forky ships both libcurl3t64-gnutls and libcurl4-gnutls at 8.21.0-2 and shlibdeps picks the latter. deb11/deb12/deb13/uqk3/uqk4/uqk5 are unaffected and keep reusing the deb11 artifact. rpi12 no longer does: since 2026-09-04 build_pkg.sh tags EVERY compiled rpi12 build categorically (Raspbian toolchain, not just build_targets exceptions), so an rpi12 pass now gets its own compile tagged 1.7.5-rpi12a1. TRAP, verified with dpkg --compare-versions on 2026-09-04: that is LOWER than the published 1.7.5-a1-rpi12, because dpkg splits at the LAST hyphen, making the published version's upstream part 1.7.5-a1 against the new build's bare 1.7.5. apt would silently keep serving the old armhf deb. This is pre-existing, not caused by the rule - the previous untagged 1.7.5-a1 lost to the published version too - and it must NOT be fixed by weakening the tagging rule. Per CLAUDE.md, a trailing-to-fused style change has to ride along with an upstream bump, so the next rpi12 build of this package needs 1.7.6 (or 1.7.5-a2) before it will supersede what is live. q4os-cpuq5 and q4os-welcome5 carry the same legacy trailing tag but are already clear, their changelogs having moved on to 4.3.2. All 16 Build-Depends exist on forky (Qt5 still shipping at 5.15.19). VERIFIED 2026-08-31 by hold-back simulation against the real r6 build chroot: q4os-imager is the ONLY installed package depending on libcurl3-gnutls, and it pins libcurl3t64-gnutls at 8.19.0-3 (the last version still providing that name); with the fixed build available the whole Plasma stack upgrades 6.5.4 -> 6.7.4 and not-upgraded drops 126 -> 3 (the 3 are the unrelated libr1/binutils issue). Publishing is now wired up: build_pkg.sh auto-tags any build_targets exception, so the deb14 compile is 1.7.5-deb14a1 (sorts above the untagged 1.7.5-a1), and publishdebs.sh gained dedup_deb14() to displace the untagged and -deb13 builds from the forky dir. Do NOT hand-edit the tag into debian/changelog - the same changelog feeds the untagged deb11 baseline build."
